events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 60M;

    # frontend assets are served raw otherwise: ~1.7M of js & css per cold load
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    server {
        listen 3000;

        # static files (SPA fallback)
        location / {
            root /app/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;

            # index.html is the only entry point, it must never be served stale:
            # it is what points to the hashed asset names
            add_header Cache-Control "no-cache";
        }

        # vite emits content-hashed file names here, so they never change contents
        location /assets/ {
            root /app/frontend;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # proxy backend API calls
        location /api/ {
            proxy_pass http://localhost:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Swagger/UI
        location /swagger {
            proxy_pass http://localhost:5000/swagger;
        }
    }
}
